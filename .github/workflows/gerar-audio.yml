name: Gerar áudio dos episódios

on:
  push:
    branches: [main]
    paths:
      - "roteiros/**.md"
  workflow_dispatch:
    inputs:
      roteiro:
        description: "Caminho de um roteiro específico pra (re)gerar (opcional; vazio = gera todos que ainda não têm áudio)"
        required: false
        default: ""

jobs:
  gerar-audio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m venv .venv
          .venv/bin/pip install -q -r scripts/requirements.txt

      - name: Gerar áudio
        run: |
          : > processados.txt
          if [ -n "${{ github.event.inputs.roteiro }}" ]; then
            roteiro="${{ github.event.inputs.roteiro }}"
            echo "Gerando áudio para $roteiro"
            .venv/bin/python scripts/gerar_audio.py "$roteiro"
            echo "$roteiro" >> processados.txt
          else
            for roteiro in roteiros/*.md; do
              slug=$(basename "$roteiro" .md)
              audio="audio/${slug}.mp3"
              if [ ! -f "$audio" ]; then
                echo "Gerando áudio para $roteiro"
                .venv/bin/python scripts/gerar_audio.py "$roteiro"
                echo "$roteiro" >> processados.txt
              fi
            done
          fi

      - name: Commit e push do áudio gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "chore: gera áudio via GitHub Actions"
            git push
          else
            echo "Nada novo pra commitar."
          fi

      - name: Criar release com o áudio
        run: |
          while IFS= read -r roteiro; do
            [ -z "$roteiro" ] && continue
            slug=$(basename "$roteiro" .md)
            audio="audio/${slug}.mp3"
            [ -f "$audio" ] || { echo "Sem áudio pra $roteiro, pulando release."; continue; }

            tag=$(echo "$slug" | grep -oE '^ep[0-9]+')
            [ -z "$tag" ] && tag="$slug"

            titulo=$(.venv/bin/python -c "
import sys, yaml
texto = open('$roteiro', encoding='utf-8').read()
front = texto.split('---', 2)[1]
d = yaml.safe_load(front)
print(d.get('titulo', '$slug'))
")

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag já existe, atualizando asset."
              gh release upload "$tag" "$audio" --clobber
            else
              echo "Criando release $tag"
              gh release create "$tag" "$audio" \
                --title "Episódio ${tag#ep}: ${titulo}" \
                --notes "Roteiro: [$roteiro](../../blob/main/$roteiro)"
            fi
          done < processados.txt
